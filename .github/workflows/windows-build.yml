# 兜底：不经发版流程直接出 Windows 安装包（fork 验证编译 / 发版流程排障用）。
# 步骤与 release.yml 的 windows job 一致，只是产物传 Actions artifact 而不是 draft Release。
name: windows-build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      # 没有签名证书：Server 不带 uiAccess（没签名的 exe 带 uiAccess=true 起不来）
      QINGJIAN_UIACCESS: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.96.0
          # 安装包另带一份 32 位 TSF DLL（build.ps1 编）
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: 拉产品数据（按 data.lock 校验）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls data/generated data/generated/dicts data/models/hanzhang-zhiwei data/models/hanzhang-tongbian

      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          # 下载来的安装程序要以管理员身份执行，先核对 SHA-256（同 release.yml）。
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qingjian-windows-installer
          path: target/installer/*.exe
          if-no-files-found: error
